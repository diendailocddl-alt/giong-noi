<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giọng nói → Zalo</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2433;--mut:#6b7587;--pri:#0068ff;--red:#e5484d;--bd:#dde3ee;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a2130;--tx:#e8edf6;--mut:#93a0b5;--bd:#2a3347}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
textarea{width:100%;min-height:200px;border:0;outline:0;resize:vertical;background:transparent;color:var(--tx);font:inherit;font-size:18px;line-height:1.5}
.status{font-size:14px;color:var(--mut);text-align:center;min-height:20px;margin:12px 0 4px}
.mic{display:block;margin:6px auto 14px;width:92px;height:92px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:38px;box-shadow:0 6px 18px rgba(0,104,255,.35)}
.mic.on{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 22px rgba(229,72,77,0)}}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1}
.btn{display:block;text-align:center;text-decoration:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:14px 8px;font-size:16px;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.zalo{background:var(--ok);border-color:var(--ok);color:#fff}
.punct{display:flex;gap:8px;margin-top:8px}
.punct button{flex:1;padding:10px 0;font-size:20px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.note{color:var(--mut);font-size:13px;margin-top:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<h1>🎙️ Giọng nói → Zalo By THANH NGUYEN GIFT TO CHAU BAO</h1>
<p class="sub">Bấm micro, nói tiếng Việt, rồi sao chép gửi Zalo.</p>

<div class="card">
<textarea id="txt" placeholder="Lời nói của bạn sẽ hiện ở đây. Có thể sửa trực tiếp..."></textarea>
</div>
<div class="punct">
<button data-p=",">,</button><button data-p=".">.</button><button data-p="?">?</button><button data-p="!">!</button><button data-p="&#10;">↵</button>
</div>

<div class="status" id="st">Sẵn sàng</div>
<button class="mic" id="mic" aria-label="Bật hoặc tắt micro">🎤</button>

<div class="row">
<button class="btn" id="clr">🗑️ Xóa</button>
<button class="btn pri" id="cp">📋 Sao chép</button>
</div>
<div class="row">
<a class="btn zalo" id="zl" href="zalo://">💬 Sao chép &amp; mở Zalo</a>
</div>

<p class="note">Mẹo: nếu micro không chạy, hãy mở trang này bằng Safari và cho phép micro. Có thể dùng nút micro trên bàn phím iPhone để đọc vào ô chữ ở trên.</p>
<div class="toast" id="toast"></div>

<script>
(function(){
var txt=document.getElementById('txt'),st=document.getElementById('st'),mic=document.getElementById('mic'),toast=document.getElementById('toast');
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null,listening=false,base='';

function say(m){st.textContent=m}
function pop(m){toast.textContent=m;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1600)}

function join(a,b){
  if(!a)return b;
  if(!b)return a;
  return /\s$/.test(a)?a+b:a+' '+b;
}

function build(){
  rec=new SR();
  rec.lang='vi-VN';
  rec.continuous=true;
  rec.interimResults=true;
  rec.onresult=function(e){
    var t='';
    for(var i=0;i<e.results.length;i++){t+=e.results[i][0].transcript}
    txt.value=join(base,t.trim());
    txt.scrollTop=txt.scrollHeight;
  };
  rec.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      listening=false;ui();
      say('Chưa được cấp quyền micro. Vào Cài đặt Safari để cho phép.');
    }else if(e.error==='no-speech'){say('Chưa nghe thấy gì, hãy nói tiếp...')}
    else if(e.error!=='aborted'){say('Lỗi: '+e.error)}
  };
  rec.onend=function(){
    if(listening){
      base=txt.value;
      setTimeout(function(){
        if(!listening)return;
        try{rec=null;build();rec.start()}catch(x){listening=false;ui();say('Đã dừng. Bấm micro để nói tiếp.')}
      },250);
    }
  };
}

function ui(){
  mic.classList.toggle('on',listening);
  mic.textContent=listening?'⏹':'🎤';
  if(listening)say('Đang nghe... bấm để dừng');
  else if(st.textContent.indexOf('Đang nghe')===0)say('Đã dừng');
}

function start(){
  if(!SR){say('Trình duyệt không hỗ trợ. Hãy mở bằng Safari (iOS 14.5 trở lên).');return}
  base=txt.value;
  build();
  try{rec.start();listening=true;ui()}catch(e){say('Không bật được micro, thử lại.')}
}
function stop(){
  listening=false;
  try{rec&&rec.stop()}catch(e){}
  ui();
}

mic.addEventListener('click',function(){listening?stop():start()});

function copyText(){
  var v=txt.value;
  if(!v.trim()){pop('Chưa có nội dung');return Promise.resolve(false)}
  var fallback=function(){
    try{
      txt.focus();txt.select();txt.setSelectionRange(0,v.length);
      var ok=document.execCommand('copy');
      txt.blur();
      return ok;
    }catch(e){return false}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(v).then(function(){return true},function(){return fallback()});
  }
  return Promise.resolve(fallback());
}

document.getElementById('cp').addEventListener('click',function(){
  if(listening)stop();
  copyText().then(function(ok){if(ok)pop('Đã sao chép ✓')});
});

document.getElementById('zl').addEventListener('click',function(){
  if(listening)stop();
  if(txt.value.trim()){
    copyText().then(function(ok){if(ok)pop('Đã sao chép, mở Zalo...')});
  }else{pop('Chưa có nội dung')}
});

document.getElementById('clr').addEventListener('click',function(){
  if(listening)stop();
  txt.value='';base='';say('Đã xóa');
});

document.querySelectorAll('.punct button').forEach(function(b){
  b.addEventListener('click',function(){
    var p=b.getAttribute('data-p');
    txt.value=txt.value.replace(/\s+$/,'')+p+(p==='\n'?'':' ');
    base=txt.value;
  });
});

txt.addEventListener('input',function(){base=txt.value});
if(!SR)say('Trình duyệt không hỗ trợ nhận giọng nói. Hãy mở bằng Safari.');
})();
</script>
</body>
</html>
